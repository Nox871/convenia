# Integración continua de Convenia: se ejecuta en cada push y en cada pull request.
# Etapas: pruebas y análisis estático. La compilación del APK se verifica en el computador
# de desarrollo (en el runner de GitHub falló por el entorno y no se pudo leer el detalle).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Pruebas del servidor (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Ejecutar pruebas (no necesitan base de datos)
        run: python -m pytest -q

  mobile:
    name: Pruebas de la app (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true
      - name: Dependencias
        run: flutter pub get
      - name: Análisis estático
        run: flutter analyze --no-fatal-infos
      - name: Pruebas
        run: flutter test
