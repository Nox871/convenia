org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Convenia no usa código nativo (sin plugins que requieran NDK). Se desactiva
# la descarga automática de componentes del SDK porque el instalador CLI
# (sdkmanager.bat) se cae con un error nativo (0xC0000409) en este equipo.
android.builder.sdkDownload=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Workaround para un bug conocido de Gradle/Kotlin en Windows: el daemon de
# compilación incremental deja archivos de caché ("*.tab") registrados dos
# veces cuando el proceso se interrumpe o corre en paralelo con otro daemon
# (síntoma: "Could not close incremental caches ... is already registered").
# Desactivar la compilación incremental de Kotlin evita la corrupción de esos
# archivos a costa de builds debug un poco más lentos -- aceptable para este
# proyecto (pocos módulos Kotlin, sólo los plugins nativos de Flutter).
kotlin.incremental=false
